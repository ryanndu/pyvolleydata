[project]
name = "pyvolleydata"
version = "2.0.0"
description = "Load professional volleyball data as pandas DataFrames."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ryan Du", email = "ryandu343@gmail.com" },
    { name = "David Awosoga" },
]
dependencies = [
    "pandas>=2.2.3",
    "pyarrow>=16.0",
    "requests>=2.32.2",
]

[project.urls]
Documentation = "https://ryanndu.github.io/pyvolleydata/"
Repository = "https://github.com/ryanndu/pyvolleydata"
Issues = "https://github.com/ryanndu/pyvolleydata/issues"
Changelog = "https://github.com/ryanndu/pyvolleydata/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyvolleydata"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "markdown-exec>=1.12.3",
    "mkdocstrings[python]>=1.0.6",
    "tabulate>=0.10.0",
    "zensical>=0.0.58",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 102
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "D",
]
ignore = [
    "D100",
    "D104",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]